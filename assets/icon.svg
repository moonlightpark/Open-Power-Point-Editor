<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Opptx app icon: a presentation screen with charts on a blue squircle.
       Deliberately avoids PowerPoint's orange tile + letter "P". -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="0.55" stop-color="#2B6FD6"/>
      <stop offset="1" stop-color="#1A47A8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF1FC"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D82F0"/><stop offset="1" stop-color="#2160C8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DB4FF"/><stop offset="1" stop-color="#4E8FEF"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC15A"/><stop offset="1" stop-color="#F59E2B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1E4A" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A2A6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>

  <!-- easel stand -->
  <g stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="30" stroke-linecap="round">
    <line x1="512" y1="640" x2="512" y2="800"/>
    <line x1="470" y1="660" x2="380" y2="808"/>
    <line x1="554" y1="660" x2="644" y2="808"/>
  </g>

  <!-- slide -->
  <g filter="url(#cardShadow)">
    <rect x="206" y="238" width="612" height="420" rx="40" fill="url(#card)"/>
  </g>
  <!-- title line -->
  <rect x="258" y="290" width="250" height="36" rx="18" fill="#2B6FD6"/>
  <rect x="258" y="342" width="160" height="20" rx="10" fill="#B9CCEB"/>
  <!-- bar chart -->
  <rect x="268" y="470" width="62" height="138" rx="14" fill="url(#bar1)"/>
  <rect x="352" y="420" width="62" height="188" rx="14" fill="url(#bar2)"/>
  <rect x="436" y="380" width="62" height="228" rx="14" fill="url(#bar3)"/>
  <!-- donut chart -->
  <g transform="translate(652 470)">
    <circle r="88" fill="none" stroke="#D3E2FA" stroke-width="44"/>
    <circle r="88" fill="none" stroke="#2B6FD6" stroke-width="44"
            stroke-dasharray="363 553" transform="rotate(-90)"/>
    <circle r="88" fill="none" stroke="#F59E2B" stroke-width="44"
            stroke-dasharray="120 553" stroke-dashoffset="-363" transform="rotate(-90)"/>
  </g>
</svg>
