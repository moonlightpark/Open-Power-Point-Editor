[package]
name = "opptx-desktop"
version = "0.1.0"
description = "Opptx — PPTX presentation editor"
edition = "2021"
rust-version = "1.86"
resolver = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }

[profile.release]
strip = true
lto = true
